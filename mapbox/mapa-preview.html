<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Meu Caramelo — mapa Mapbox</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #FCF6EE; --ink: #2B1D12; --ink2: #6B5645; --muted: #9A8571;
    --line: #EBDFD0; --caramel: #B9702F; --green: #3E8F5E; --alert: #C1452F;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: 'Instrument Sans', system-ui, sans-serif; color: var(--ink); background: #EFEAE0; }
  #app { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #mapa { position: absolute; inset: 0; }

  .token-bar { position: absolute; z-index: 20; top: 0; left: 0; right: 0; background: var(--ink); color: #FFF7EC; padding: 12px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .token-bar input { flex: 1 1 260px; min-width: 0; height: 40px; border-radius: 10px; border: none; padding: 0 12px; font: inherit; font-size: 13px; }
  .token-bar button { height: 40px; padding: 0 18px; border-radius: 10px; border: none; background: var(--caramel); color: #FFF7EC; font: inherit; font-weight: 700; cursor: pointer; }
  .token-bar small { flex-basis: 100%; color: #B6A28C; font-size: 11.5px; line-height: 1.4; }
  .token-bar.oculta { display: none; }

  .chrome { position: absolute; inset: 0; pointer-events: none; }
  .topo { position: absolute; top: 16px; left: 14px; right: 14px; display: flex; flex-direction: column; gap: 10px; }
  .busca { display: flex; gap: 10px; }
  .pill { background: #fff; border-radius: 999px; box-shadow: 0 4px 14px rgba(43,29,18,.16); display: flex; align-items: center; }
  .busca .campo { flex: 1; height: 48px; padding: 0 16px; gap: 10px; color: var(--muted); font-size: 14px; }
  .busca .redondo { width: 48px; height: 48px; justify-content: center; color: var(--ink); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { height: 34px; padding: 0 14px; border-radius: 999px; background: #fff; color: var(--ink2); font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(43,29,18,.12); pointer-events: auto; cursor: pointer; border: none; font-family: inherit; }
  .chip.ativo { background: var(--ink); color: #FFF7EC; }
  .ponto-cor { width: 8px; height: 8px; border-radius: 999px; }

  .marcador { width: 42px; height: 42px; border-radius: 999px; border: 3px solid #fff; box-shadow: 0 4px 12px rgba(43,29,18,.3); display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; }
  .marcador svg { width: 21px; height: 21px; }

  .folha { position: absolute; left: 12px; right: 12px; bottom: 14px; background: #fff; border-radius: 22px; box-shadow: 0 -2px 24px rgba(43,29,18,.18); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; pointer-events: auto; max-width: 420px; margin: 0 auto; }
  .alca { width: 38px; height: 4px; border-radius: 999px; background: var(--line); align-self: center; }
  .folha h2 { margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 18px; font-weight: 700; }
  .folha .meta { font-size: 12.5px; color: #8A7460; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { height: 24px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; }
  .acoes { display: flex; gap: 10px; }
  .acoes .btn { flex: 1; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 14.5px; font-weight: 600; border: 1.5px solid var(--line); background: #fff; color: var(--ink); }
  .acoes .btn.primario { flex: 1.4; background: var(--caramel); color: #FFF7EC; border-color: var(--caramel); font-weight: 700; }

  .mapboxgl-ctrl-bottom-left, .mapboxgl-ctrl-bottom-right { z-index: 5; }
  .erro { position: absolute; z-index: 30; top: 50%; left: 24px; right: 24px; transform: translateY(-50%); background: #fff; border-radius: 18px; padding: 20px; text-align: center; font-size: 14px; line-height: 1.5; box-shadow: 0 8px 30px rgba(43,29,18,.2); }
</style>
</head>
<body>
<div id="app">
  <div id="mapa"></div>

  <div class="chrome">
    <div class="topo">
      <div class="busca">
        <div class="pill campo">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.2"/><path d="M20 20l-4.6-4.6"/></svg>
          Buscar ponto ou endereço
        </div>
        <div class="pill redondo">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6Z"/><path d="M10.3 19a2 2 0 0 0 3.4 0"/></svg>
        </div>
      </div>
      <div class="chips">
        <button class="chip ativo" data-filtro="todos">Todos</button>
        <button class="chip" data-filtro="urgente"><span class="ponto-cor" style="background:#C1452F"></span>Sem comida</button>
        <button class="chip" data-filtro="ok"><span class="ponto-cor" style="background:#3E8F5E"></span>Ok hoje</button>
      </div>
    </div>

    <div class="folha" id="folha"></div>
  </div>

  <div class="token-bar" id="tokenBar">
    <input id="tokenInput" type="text" placeholder="Cole aqui seu token público do Mapbox (pk....)" autocomplete="off" spellcheck="false">
    <button id="tokenBtn">Carregar mapa</button>
    <small>Pegue em account.mapbox.com → Access tokens. Fica salvo só neste navegador (localStorage) e não sai daqui.</small>
  </div>
</div>

<script>
const ESTILO = {
  "version": 8,
  "name": "Meu Caramelo — Caramelo Quente",
  "glyphs": "mapbox://fonts/mapbox/{fontstack}/{range}.pbf",
  "sprite": "mapbox://sprites/mapbox/streets-v12",
  "sources": {
    "composite": {
      "type": "vector",
      "url": "mapbox://mapbox.mapbox-streets-v8"
    }
  },
  "layers": [
    {
      "id": "fundo",
      "type": "background",
      "paint": { "background-color": "#EFEAE0" }
    },
    {
      "id": "area-verde",
      "type": "fill",
      "source": "composite",
      "source-layer": "landuse",
      "filter": ["match", ["get", "class"], ["park", "grass", "pitch", "cemetery", "scrub", "wood"], true, false],
      "paint": { "fill-color": "#CFE2BE", "fill-opacity": 0.9 }
    },
    {
      "id": "area-construida",
      "type": "fill",
      "source": "composite",
      "source-layer": "landuse",
      "filter": ["match", ["get", "class"], ["hospital", "school", "commercial_area"], true, false],
      "paint": { "fill-color": "#E8E1D2" }
    },
    {
      "id": "agua",
      "type": "fill",
      "source": "composite",
      "source-layer": "water",
      "paint": { "fill-color": "#AFD2E5" }
    },
    {
      "id": "curso-dagua",
      "type": "line",
      "source": "composite",
      "source-layer": "waterway",
      "paint": {
        "line-color": "#AFD2E5",
        "line-width": ["interpolate", ["linear"], ["zoom"], 12, 1, 18, 6]
      }
    },
    {
      "id": "predios",
      "type": "fill",
      "source": "composite",
      "source-layer": "building",
      "minzoom": 14,
      "paint": {
        "fill-color": "#E2DACA",
        "fill-outline-color": "#D8CFBC",
        "fill-opacity": ["interpolate", ["linear"], ["zoom"], 14, 0, 15.5, 1]
      }
    },

    {
      "id": "via-local-contorno",
      "type": "line",
      "source": "composite",
      "source-layer": "road",
      "minzoom": 13,
      "filter": ["match", ["get", "class"], ["street", "street_limited", "service", "track"], true, false],
      "layout": { "line-cap": "round", "line-join": "round" },
      "paint": {
        "line-color": "#E6E0D0",
        "line-width": ["interpolate", ["exponential", 1.5], ["zoom"], 13, 2, 18, 18]
      }
    },
    {
      "id": "via-local",
      "type": "line",
      "source": "composite",
      "source-layer": "road",
      "minzoom": 13,
      "filter": ["match", ["get", "class"], ["street", "street_limited", "service", "track"], true, false],
      "layout": { "line-cap": "round", "line-join": "round" },
      "paint": {
        "line-color": "#FEFCF7",
        "line-width": ["interpolate", ["exponential", 1.5], ["zoom"], 13, 1, 18, 13]
      }
    },

    {
      "id": "via-secundaria-contorno",
      "type": "line",
      "source": "composite",
      "source-layer": "road",
      "filter": ["match", ["get", "class"], ["secondary", "tertiary"], true, false],
      "layout": { "line-cap": "round", "line-join": "round" },
      "paint": {
        "line-color": "#DED7C7",
        "line-width": ["interpolate", ["exponential", 1.5], ["zoom"], 10, 2, 18, 24]
      }
    },
    {
      "id": "via-secundaria",
      "type": "line",
      "source": "composite",
      "source-layer": "road",
      "filter": ["match", ["get", "class"], ["secondary", "tertiary"], true, false],
      "layout": { "line-cap": "round", "line-join": "round" },
      "paint": {
        "line-color": "#FEFCF7",
        "line-width": ["interpolate", ["exponential", 1.5], ["zoom"], 10, 1, 18, 18]
      }
    },

    {
      "id": "via-principal-contorno",
      "type": "line",
      "source": "composite",
      "source-layer": "road",
      "filter": ["match", ["get", "class"], ["primary"], true, false],
      "layout": { "line-cap": "round", "line-join": "round" },
      "paint": {
        "line-color": "#D8CDB6",
        "line-width": ["interpolate", ["exponential", 1.5], ["zoom"], 8, 2, 18, 30]
      }
    },
    {
      "id": "via-principal",
      "type": "line",
      "source": "composite",
      "source-layer": "road",
      "filter": ["match", ["get", "class"], ["primary"], true, false],
      "layout": { "line-cap": "round", "line-join": "round" },
      "paint": {
        "line-color": "#FFFFFF",
        "line-width": ["interpolate", ["exponential", 1.5], ["zoom"], 8, 1, 18, 23]
      }
    },

    {
      "id": "rodovia-contorno",
      "type": "line",
      "source": "composite",
      "source-layer": "road",
      "filter": ["match", ["get", "class"], ["motorway", "trunk", "motorway_link", "trunk_link"], true, false],
      "layout": { "line-cap": "round", "line-join": "round" },
      "paint": {
        "line-color": "#E0A93A",
        "line-width": ["interpolate", ["exponential", 1.5], ["zoom"], 6, 2, 18, 32]
      }
    },
    {
      "id": "rodovia",
      "type": "line",
      "source": "composite",
      "source-layer": "road",
      "filter": ["match", ["get", "class"], ["motorway", "trunk", "motorway_link", "trunk_link"], true, false],
      "layout": { "line-cap": "round", "line-join": "round" },
      "paint": {
        "line-color": "#F8CD68",
        "line-width": ["interpolate", ["exponential", 1.5], ["zoom"], 6, 1, 18, 25]
      }
    },

    {
      "id": "caminho",
      "type": "line",
      "source": "composite",
      "source-layer": "road",
      "minzoom": 15,
      "filter": ["match", ["get", "class"], ["path", "pedestrian", "footway"], true, false],
      "layout": { "line-cap": "round" },
      "paint": {
        "line-color": "#D6CDB9",
        "line-width": 2,
        "line-dasharray": [2, 2]
      }
    },

    {
      "id": "rotulo-via",
      "type": "symbol",
      "source": "composite",
      "source-layer": "road",
      "minzoom": 13,
      "filter": ["match", ["get", "class"], ["motorway", "trunk", "primary", "secondary", "tertiary", "street"], true, false],
      "layout": {
        "symbol-placement": "line",
        "text-field": ["coalesce", ["get", "name_pt"], ["get", "name"]],
        "text-font": ["DIN Pro Medium", "Arial Unicode MS Regular"],
        "text-size": ["interpolate", ["linear"], ["zoom"], 13, 9, 18, 13],
        "text-letter-spacing": 0.02,
        "text-max-angle": 30
      },
      "paint": {
        "text-color": "#7E7464",
        "text-halo-color": "#FCF6EE",
        "text-halo-width": 1.4
      }
    },
    {
      "id": "rotulo-bairro",
      "type": "symbol",
      "source": "composite",
      "source-layer": "place_label",
      "filter": ["match", ["get", "type"], ["neighbourhood", "suburb", "quarter"], true, false],
      "layout": {
        "text-field": ["coalesce", ["get", "name_pt"], ["get", "name"]],
        "text-font": ["DIN Pro Bold", "Arial Unicode MS Bold"],
        "text-size": ["interpolate", ["linear"], ["zoom"], 12, 11, 16, 15],
        "text-letter-spacing": 0.08,
        "text-transform": "uppercase"
      },
      "paint": {
        "text-color": "#8A7460",
        "text-halo-color": "#FCF6EE",
        "text-halo-width": 1.6
      }
    },
    {
      "id": "rotulo-cidade",
      "type": "symbol",
      "source": "composite",
      "source-layer": "place_label",
      "filter": ["match", ["get", "type"], ["city", "town", "village"], true, false],
      "layout": {
        "text-field": ["coalesce", ["get", "name_pt"], ["get", "name"]],
        "text-font": ["DIN Pro Bold", "Arial Unicode MS Bold"],
        "text-size": ["interpolate", ["linear"], ["zoom"], 8, 13, 14, 20]
      },
      "paint": {
        "text-color": "#5C3A21",
        "text-halo-color": "#FCF6EE",
        "text-halo-width": 1.8
      }
    },
    {
      "id": "rotulo-poi",
      "type": "symbol",
      "source": "composite",
      "source-layer": "poi_label",
      "minzoom": 15,
      "filter": ["match", ["get", "class"], ["park_like", "food_and_drink", "medical", "education"], true, false],
      "layout": {
        "text-field": ["coalesce", ["get", "name_pt"], ["get", "name"]],
        "text-font": ["DIN Pro Medium", "Arial Unicode MS Regular"],
        "text-size": 11,
        "text-offset": [0, 0.8],
        "text-anchor": "top",
        "text-max-width": 8
      },
      "paint": {
        "text-color": "#8A7460",
        "text-halo-color": "#FCF6EE",
        "text-halo-width": 1.4
      }
    }
  ]
};

const PONTOS = [
  { id: 1, nome: 'Praça da Matriz',  endereco: 'R. Sete de Setembro, 120', lng: -48.3610, lat: -7.1905, status: 'precisa', horas: 6,  animais: '4 gatos · 2 cães' },
  { id: 2, nome: 'Viaduto da Rodoviária', endereco: 'Av. Perimetral, s/n', lng: -48.3672, lat: -7.1948, status: 'urgente', horas: 19, animais: '5 cães' },
  { id: 3, nome: 'Parque Municipal', endereco: 'Portão norte',            lng: -48.3549, lat: -7.1872, status: 'ok',      horas: 2,  animais: '3 gatos' },
  { id: 4, nome: 'Estacionamento do Mercado', endereco: 'R. do Comércio, 45', lng: -48.3588, lat: -7.1955, status: 'ok',   horas: 3,  animais: '2 cães' },
];

const CORES = { ok: '#3E8F5E', precisa: '#B9702F', urgente: '#C1452F' };
const ROTULOS = { ok: ['Ok hoje', '#E4F0E7', '#2F6B48'], precisa: ['Precisa hoje', '#FBECDA', '#8F521C'], urgente: ['Sem comida', '#F9E7E2', '#A03A26'] };

const ICONE_PATA = '<svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="6.5" cy="9.5" rx="2" ry="2.5"/><ellipse cx="10.6" cy="6.6" rx="2" ry="2.5"/><ellipse cx="15" cy="6.8" rx="2" ry="2.5"/><ellipse cx="18.4" cy="10.6" rx="1.9" ry="2.3"/><path d="M12.4 12.6c2.6 0 4.7 1.8 5.3 3.8.6 2-.8 3.8-3 3.8-1 0-1.7-.3-2.3-.3s-1.3.3-2.3.3c-2.2 0-3.6-1.8-3-3.8.6-2 2.7-3.8 5.3-3.8Z"/></svg>';

let mapa = null;
let marcadores = [];
let filtro = 'todos';

function mostraFolha(p) {
  const [texto, fundo, cor] = ROTULOS[p.status];
  document.getElementById('folha').innerHTML = `
    <div class="alca"></div>
    <h2>${p.nome}</h2>
    <div class="meta">${p.endereco}</div>
    <div class="tags">
      <span class="tag" style="background:${fundo};color:${cor}">${texto}</span>
      <span class="tag" style="background:#F2EDE5;color:#6B5645">última há ${p.horas} h</span>
      <span class="tag" style="background:#F2EDE5;color:#6B5645">${p.animais}</span>
    </div>
    <div class="acoes">
      <div class="btn">Ver ponto</div>
      <div class="btn primario">Alimentar</div>
    </div>`;
}

function desenhaPontos() {
  marcadores.forEach(m => m.remove());
  marcadores = PONTOS
    .filter(p => filtro === 'todos' || (filtro === 'ok' ? p.status === 'ok' : p.status !== 'ok'))
    .map(p => {
      const el = document.createElement('div');
      el.className = 'marcador';
      el.style.background = CORES[p.status];
      el.innerHTML = ICONE_PATA;
      el.addEventListener('click', () => {
        mostraFolha(p);
        mapa.easeTo({ center: [p.lng, p.lat], zoom: Math.max(mapa.getZoom(), 15.5), offset: [0, -110] });
      });
      return new mapboxgl.Marker({ element: el }).setLngLat([p.lng, p.lat]).addTo(mapa);
    });
}

function inicia(token) {
  mapboxgl.accessToken = token;
  try {
    mapa = new mapboxgl.Map({
      container: 'mapa',
      style: ESTILO,
      center: [-48.3610, -7.1920],
      zoom: 15.2,
      attributionControl: true,
    });
  } catch (e) {
    document.body.insertAdjacentHTML('beforeend', '<div class="erro">Não foi possível iniciar o mapa: ' + e.message + '</div>');
    return;
  }

  mapa.addControl(new mapboxgl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true, showUserHeading: true }), 'bottom-right');
  mapa.on('load', () => { desenhaPontos(); mostraFolha(PONTOS[0]); });
  mapa.on('error', e => {
    if (e.error && /401|403|token/i.test(e.error.message || '')) {
      document.getElementById('tokenBar').classList.remove('oculta');
      localStorage.removeItem('mc_mapbox_token');
    }
  });

  document.getElementById('tokenBar').classList.add('oculta');
}

document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(o => o.classList.remove('ativo'));
  c.classList.add('ativo');
  filtro = c.dataset.filtro;
  if (mapa) desenhaPontos();
}));

document.getElementById('tokenBtn').addEventListener('click', () => {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t) return;
  try { localStorage.setItem('mc_mapbox_token', t); } catch (e) {}
  inicia(t);
});
document.getElementById('tokenInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('tokenBtn').click();
});

let salvo = null;
try { salvo = localStorage.getItem('mc_mapbox_token'); } catch (e) {}
if (salvo) inicia(salvo);
</script>
</body>
</html>
